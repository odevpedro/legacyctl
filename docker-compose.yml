services:
  postgres:
    image: postgres:16-alpine
    container_name: legacyctl-demo-db
    environment:
      POSTGRES_DB: legacy_demo
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
    ports:
      - "5432:5432"
    volumes:
      - ./demo-new-system/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d legacy_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
