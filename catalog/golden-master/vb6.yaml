# Golden Master -- fixtures/vb6
#
# Curated by hand from the legacy sources, never generated by a model. Each
# case names where its expectation came from, which the loader enforces.
#
# The fixture is fictional VB6 and does not run in the MVP, so the evidence is
# "observação manual": a human read the procedure and recorded what it decides.
# Replace it with "query do SGBD" or "execução do legado" when real evidence
# exists.
system_id: SYS-VB6
notes: >-
  Curated from manual observation of the legacy sources. The expectations are
  what a reader can point at in the code, not invented outcomes.
cases:
  - case_id: GM-CUSTOMER-001
    flow_id: FLOW-CUSTOMERFORM_VALIDATECUSTOMER
    entry_point: CustomerForm.ValidateCustomer
    description: The credit-limit guard fires; the branch decides the outcome.
    in_params:
      name: Maria Souza
      cpf: "12345678900"
      requestedCredit: "9999"
      creditLimit: "5000"
    out_params:
      RULE-CUSTOMERFORM_VALIDATECUSTOMER-002: fired
    evidence: observação manual
    captured_from: Customer.bas, procedure CheckCreditLimit
    tags:
      - customer
      - credit-limit
  - case_id: GM-CUSTOMER-002
    flow_id: FLOW-CUSTOMERFORM_VALIDATECUSTOMER
