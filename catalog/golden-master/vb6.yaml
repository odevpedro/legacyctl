    description: The credit-limit guard does not fire.
    in_params:
      name: Maria Souza
      cpf: "12345678900"
      requestedCredit: "1000"
      creditLimit: "5000"
    out_params:
      RULE-CUSTOMERFORM_VALIDATECUSTOMER-002: not_fired
    evidence: observação manual
    tags:
      - customer
      - credit-limit
  - case_id: GM-CUSTOMER-003
    flow_id: FLOW-CUSTOMERFORM_VALIDATECUSTOMER
    entry_point: CustomerForm.ValidateCustomer
    description: A CPF matching the repeated-digit pattern is rejected.
    in_params:
      name: Maria Souza
      cpf: "11111111111"
      requestedCredit: "1000"
      creditLimit: "5000"
    out_params:
      RULE-CUSTOMERFORM_VALIDATECUSTOMER-001: fired
    evidence: observação manual
    tags:
      - validation
  - case_id: GM-CUSTOMER-004
    flow_id: FLOW-CUSTOMERFORM_VALIDATECUSTOMER
    entry_point: CustomerForm.ValidateCustomer
    description: >-
      Blank identity data is rejected by the form before any credit check.
    in_params:
      name: ""
      cpf: ""
      requestedCredit: "1000"
    out_params:
      RULE-CUSTOMERFORM_VALIDATECUSTOMER-004: reject
