[project]
name = "legacy-refactoring-framework"
version = "0.1.0"
description = "Framework para análise estrutural, extração de comportamento, formalização de contratos e verificação da modernização de sistemas legados, utilizando LLMs apenas onde interpretação semântica é necessária."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "legacy-refactoring-framework contributors" }]
keywords = [
    "legacy",
    "refactoring",
    "modernization",
    "reverse-engineering",
    "vb6",
    "openapi",
    "golden-master",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.2",
    "sqlglot>=25.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
community = ["python-igraph>=0.11"]
llm = ["openai>=1.30", "anthropic>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
legacyctl = "legacyctl.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacyctl"]

[tool.hatch.build.targets.wheel.force-include]
"src/legacyctl/llm/prompts" = "legacyctl/llm/prompts"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "fixtures", "adapters", "docs", "catalog", "contracts"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require external tooling (Java, Docker, OpenAPI Generator)",
]
filterwarnings = ["error::DeprecationWarning:legacyctl.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN", "TID"]
# TID252: the package intentionally uses explicit relative imports so that
# ``legacyctl.parsers.vb6`` cannot collide with a same-named third-party module.
ignore = ["ANN401", "B008", "RUF001", "RUF002", "RUF003", "TID252"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.ruff.lint.isort]
known-first-party = ["legacyctl"]

[tool.mypy]
python_version = "3.12"
files = ["src/legacyctl"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlglot.*", "igraph.*", "networkx.*", "typer.*", "openai.*", "anthropic.*"]
ignore_missing_imports = true
